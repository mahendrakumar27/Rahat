name: Backend tests

on:
  push:
    paths:
      - "app.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "app.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q
